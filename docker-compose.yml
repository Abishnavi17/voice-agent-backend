# docker-compose.yml - the conductor that runs the WHOLE system with one command.
#
#   docker compose up --build
#
# It starts three containers and wires them onto one private network so they can
# find each other by NAME (db, redis). This is why the app reads DATABASE_URL and
# REDIS_URL from the environment all along: here we point them at the service
# names instead of localhost, and nothing in the code changes.

services:
  # ---- PostgreSQL: the database ----
  db:
    image: postgres:16                 # official Postgres image, no build needed
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voiceagent          # creates the voiceagent database on first run
    volumes:
      - pgdata:/var/lib/postgresql/data  # persist data across restarts (see below)
    healthcheck:                        # lets other services wait until DB is ready
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---- Redis: the cache ----
  redis:
    image: redis:7                     # official Redis image
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---- The app: built from our Dockerfile ----
  app:
    build: .                           # build the image from the Dockerfile here
    ports:
      - "8000:8000"                    # map host port 8000 -> container port 8000
    environment:
      # Point the app at the OTHER services by their compose name (db, redis).
      # Inside the compose network, "db" and "redis" resolve to those containers.
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/voiceagent"
      REDIS_URL: "redis://redis:6379/0"
      # Cache the downloaded models in a mounted volume so they are not
      # re-downloaded every time the container restarts.
      HF_HOME: "/models/hf"
      XDG_CACHE_HOME: "/models/cache"
    volumes:
      - models:/models                 # persist downloaded Whisper/LLM weights
    depends_on:
      db:
        condition: service_healthy     # wait for Postgres healthcheck to pass
      redis:
        condition: service_healthy     # wait for Redis healthcheck to pass

# Named volumes: Docker-managed storage that survives `docker compose down` and
# restarts, so your database rows and downloaded models are not lost each time.
volumes:
  pgdata:
  models:
